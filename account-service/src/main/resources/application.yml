spring:
  application:
    name: account-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

poorbet:
  security:
    enabled: true
    issuer: ${AUTH_ISSUER_URI}
    jwk-set-uri: ${AUTH_JWKS_URI}
    internal-audience:
      - account-service
    unprotected-paths:
      - /actuator/health/**

messaging:
  source-service: account-service

  consumers:
    USER_CREATED:
      queue: account.user-created.queue
    COUPON_WON:
      queue: account.coupon-won.queue
    COUPON_LOST:
      queue: account.coupon-lost.queue
