spring:
  application:
    name: account-service

  flyway:
    enabled: true
    locations: classpath:db/migration

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

poorbet:
  security:
    enabled: true
    issuer: ${AUTH_ISSUER_URI}
    jwk-set-uri: ${AUTH_JWKS_URI}

messaging:
  source-service: account-service

  consumers:
    USER_CREATED:
      queue: account.user-created.queue
    COUPON_CREATION_FAILED:
      queue: account.coupon-creation-failed.queue
    COUPON_WON:
      queue: account.coupon-won.queue
    COUPON_LOST:
      queue: account.coupon-lost.queue
