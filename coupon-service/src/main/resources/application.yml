spring:
  application:
    name: coupon-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

poorbet:
  security:
    enabled: true
    issuer: ${AUTH_ISSUER_URI}
    jwk-set-uri: ${AUTH_JWKS_URI}
    internal-audience:
      - coupon-service
    unprotected-paths:
      - /actuator/health/**
      - /api/teams/public/**
      - /api/coupons/public/**

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8080}
    client-id: ${COUPON_SERVICE_CLIENT_ID:coupon-service}
    client-secret: ${COUPON_SERVICE_CLIENT_SECRET:secret}
    timeout:
      connect: ${AUTH_SERVICE_CONNECT_TIMEOUT:2s}
      read: ${AUTH_SERVICE_READ_TIMEOUT:3s}

match:
  service:
    url: ${MATCH_SERVICE_URL:http://match-service:8080}
    timeout:
      connect: 2s
      read: 3s

wallet:
  service:
    url: ${WALLET_SERVICE_URL:http://account-service:8080}
    timeout:
      connect: 2s
      read: 3s

messaging:
  source-service: coupon-service
  consumers:
    MATCH_FINISHED:
      queue: coupon.match-finished.queue
