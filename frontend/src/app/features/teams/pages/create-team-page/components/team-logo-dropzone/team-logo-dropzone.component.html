<div
  class="relative flex cursor-pointer flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed p-6 text-center transition-colors duration-fast"
  [class.border-app-primary]="isDragging()"
  [class.bg-app-primarySoft]="isDragging()"
  [class.border-app-danger]="error() && !isDragging()"
  [class.border-app-border]="!isDragging() && !error()"
  role="button"
  tabindex="0"
  [attr.aria-label]="'team.form.logo.label' | transloco"
  [attr.aria-invalid]="error() ? true : null"
  [attr.aria-describedby]="error() ? 'team-logo-dropzone-error' : null"
  data-testid="create-team-logo-dropzone"
  (click)="logoFileInput.click()"
  (keydown.enter)="logoFileInput.click()"
  (keydown.space)="$event.preventDefault(); logoFileInput.click()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @if (previewUrl(); as previewUrl) {
    <img
      [src]="previewUrl"
      [alt]="'team.form.logo.previewAlt' | transloco"
      class="h-20 w-20 rounded-full border border-app-border object-cover"
    />

    <div class="mt-1 flex gap-4">
      <button
        type="button"
        class="t-body-xs text-app-primary underline"
        (click)="$event.stopPropagation(); logoFileInput.click()"
      >
        {{ "team.form.logo.change" | transloco }}
      </button>
      <button
        type="button"
        class="t-body-xs text-app-danger underline"
        (click)="onClear($event)"
      >
        {{ "team.form.logo.remove" | transloco }}
      </button>
    </div>
  } @else {
    <pb-icon icon="cloud_upload" size="lg" color="primary"></pb-icon>
    <p class="t-body-sm">{{ "team.form.logo.dropzoneTitle" | transloco }}</p>
    <p class="t-body-xs t-muted">
      {{ "team.form.logo.dropzoneHint" | transloco }}
    </p>
  }

  <input
    #logoFileInput
    id="create-team-logo-input"
    type="file"
    accept="image/png,image/jpeg"
    data-testid="create-team-logo-input"
    class="hidden"
    (click)="$event.stopPropagation()"
    (change)="onFileSelected($event)"
  />
</div>
