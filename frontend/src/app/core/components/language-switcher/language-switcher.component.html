<pb-popover [ariaLabel]="'a11y.openLanguageMenu' | transloco">
  <div class="pb-overlay-trigger" popoverTrigger>
    @if (imageType()) {
      <pb-image [type]="imageType()!" size="md"></pb-image>
    }
  </div>

  <div popoverContent>
    <app-language-content (langSelected)="closePopover()" />
  </div>
</pb-popover>
