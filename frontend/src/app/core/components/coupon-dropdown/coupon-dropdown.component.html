<pb-popover
  #popoverRef
  width="400px"
  [ariaLabel]="'a11y.openCoupons' | transloco"
>
  <div class="pb-overlay-trigger" popoverTrigger>
    <pb-icon icon="library_books" size="m"></pb-icon>
  </div>

  <div popoverContent>
    @if (popoverRef.isOpen()) {
      <app-coupon-list (seeAll)="popoverRef.close()" />
    }
  </div>
</pb-popover>
